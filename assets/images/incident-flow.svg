<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-label="What happens when something goes wrong">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#64748b"/></marker>
  </defs>
  <rect width="880" height="520" rx="20" fill="url(#bg)"/>
  <text x="440" y="38" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">When something goes wrong  step by step</text>
  <text x="440" y="62" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12">Your phone knows in seconds. The right people get called. Every step is saved.</text>

  <!-- Step boxes -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- 1 -->
    <rect x="40" y="90" width="150" height="72" rx="10" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="115" y="118" text-anchor="middle" fill="#fecaca" font-size="13" font-weight="700">1. Trigger</text>
    <text x="115" y="140" text-anchor="middle" fill="#fca5a5" font-size="10">Door · panic · sensor</text>

    <line x1="190" y1="126" x2="218" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 2 -->
    <rect x="220" y="90" width="150" height="72" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="295" y="118" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">2. Alert first</text>
    <text x="295" y="140" text-anchor="middle" fill="#93c5fd" font-size="10">App · call · message</text>

    <line x1="370" y1="126" x2="398" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 3 -->
    <rect x="400" y="90" width="150" height="72" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <text x="475" y="118" text-anchor="middle" fill="#e9d5ff" font-size="13" font-weight="700">3. AI judges</text>
    <text x="475" y="140" text-anchor="middle" fill="#d8b4fe" font-size="10">Score + plain reason</text>

    <line x1="550" y1="126" x2="578" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 4 -->
    <rect x="580" y="90" width="150" height="72" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="655" y="118" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="700">4. Right steps</text>
    <text x="655" y="140" text-anchor="middle" fill="#86efac" font-size="10">Fire / SOS / intrusion</text>

    <line x1="730" y1="126" x2="758" y2="126" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 5 -->
    <rect x="690" y="200" width="150" height="72" rx="10" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="765" y="228" text-anchor="middle" fill="#ffedd5" font-size="13" font-weight="700">5. Send someone</text>
    <text x="765" y="250" text-anchor="middle" fill="#fdba74" font-size="10">Nearest · on map</text>

    <!-- down from 4 -->
    <path d="M 655 162 L 655 186 L 765 186 L 765 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>

    <!-- 6 -->
    <rect x="520" y="200" width="150" height="72" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="595" y="228" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">6. Team up</text>
    <text x="595" y="250" text-anchor="middle" fill="#93c5fd" font-size="10">Big event · roles</text>

    <line x1="520" y1="236" x2="492" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 7 -->
    <rect x="340" y="200" width="150" height="72" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="415" y="228" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">7. Escalate</text>
    <text x="415" y="250" text-anchor="middle" fill="#cbd5e1" font-size="10">No answer ’ next</text>

    <line x1="340" y1="236" x2="312" y2="236" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 8 -->
    <rect x="160" y="200" width="150" height="72" rx="10" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <text x="235" y="228" text-anchor="middle" fill="#e9d5ff" font-size="13" font-weight="700">8. Resolved</text>
    <text x="235" y="250" text-anchor="middle" fill="#d8b4fe" font-size="10">Marked on phone</text>

    <line x1="235" y1="272" x2="235" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

    <!-- 9 proof -->
    <rect x="120" y="310" width="640" height="56" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="440" y="335" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">9. Everything saved  timeline, calls, who went, when they arrived</text>
    <text x="440" y="355" text-anchor="middle" fill="#64748b" font-size="11">Proof you can show managers, insurers, or auditors</text>
  </g>

  <!-- Side note -->
  <rect x="40" y="400" width="800" height="95" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="428" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Safety rules always run first</text>
  <text x="60" y="450" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">The machine can make something MORE urgent  never quietly less. Dangerous steps wait for a human "yes."</text>
  <text x="60" y="472" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">If the smart part is down, basic alerts and calls still work.</text>
</svg>
