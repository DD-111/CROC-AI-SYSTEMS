<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Command Center  live map and incident feed">
  <defs>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="12" fill="#334155"/>
  <rect x="8" y="8" width="784" height="464" rx="8" fill="url(#screen)" stroke="#475569"/>

  <!-- Title bar -->
  <rect x="8" y="8" width="784" height="36" rx="8" fill="#0f172a"/>
  <text x="24" y="32" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Command Center</text>
  <circle cx="760" cy="26" r="6" fill="#22c55e"/>
  <text x="730" y="30" fill="#86efac" font-family="Segoe UI, Arial, sans-serif" font-size="10">Live</text>

  <!-- Map area -->
  <rect x="20" y="56" width="480" height="300" rx="8" fill="#0c4a6e" stroke="#0369a1"/>
  <text x="40" y="80" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="11">Live site map</text>
  <!-- fake map pins -->
  <circle cx="120" cy="180" r="8" fill="#22c55e" stroke="#fff" stroke-width="2"/>
  <circle cx="280" cy="140" r="8" fill="#22c55e" stroke="#fff" stroke-width="2"/>
  <circle cx="350" cy="220" r="10" fill="#ef4444" stroke="#fff" stroke-width="2"/>
  <circle cx="200" cy="260" r="8" fill="#eab308" stroke="#fff" stroke-width="2"/>
  <text x="365" y="225" fill="#fecaca" font-size="9" font-family="Segoe UI">  active</text>
  <!-- responder pin -->
  <circle cx="300" cy="200" r="6" fill="#3b82f6" stroke="#fff" stroke-width="2"/>
  <text x="310" y="204" fill="#93c5fd" font-size="9" font-family="Segoe UI">’ responder</text>

  <!-- Incident feed -->
  <rect x="512" y="56" width="268" height="300" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="528" y="80" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">Active incidents</text>

  <!-- incident card 1 -->
  <rect x="524" y="92" width="244" height="72" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="536" y="112" fill="#fecaca" font-size="11" font-weight="700" font-family="Segoe UI">North gate · after hours</text>
  <text x="536" y="130" fill="#fca5a5" font-size="10" font-family="Segoe UI">Urgency: 89 / 100  HIGH</text>
  <text x="536" y="148" fill="#fed7aa" font-size="9" font-family="Segoe UI">’ Call on-duty · dispatch nearest</text>

  <!-- incident card 2 -->
  <rect x="524" y="174" width="244" height="56" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="536" y="194" fill="#bfdbfe" font-size="11" font-family="Segoe UI">Parking B · door held open</text>
  <text x="536" y="212" fill="#93c5fd" font-size="10" font-family="Segoe UI">Urgency: 34 / 100  watch</text>

  <!-- incident card 3 -->
  <rect x="524" y="240" width="244" height="48" rx="6" fill="#14532d" stroke="#22c55e"/>
  <text x="536" y="260" fill="#bbf7d0" font-size="11" font-family="Segoe UI">Lobby · resolved 10:49</text>
  <text x="536" y="276" fill="#86efac" font-size="9" font-family="Segoe UI">Admin arrived · logged</text>

  <!-- Timeline strip -->
  <rect x="20" y="368" width="760" height="96" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="36" y="392" fill="#f8fafc" font-size="11" font-weight="700" font-family="Segoe UI">Incident timeline (one event)</text>
  <text x="36" y="416" fill="#94a3b8" font-size="10" font-family="Segoe UI">10:42:03 trigger ’ 10:42:05 scored 89 ’ 10:42:06 called officer ’ 10:42:20 escalated ’ 10:42:31 admin answered ’ 10:49:00 resolved</text>
  <text x="36" y="440" fill="#64748b" font-size="9" font-family="Segoe UI">Every step timestamped · AI + human actions · exportable for review</text>

  <text x="400" y="468" text-anchor="middle" fill="#64748b" font-size="9" font-family="Segoe UI, Arial, sans-serif">Illustration  your real dashboard shows live data from your site</text>
</svg>
