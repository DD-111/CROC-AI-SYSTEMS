<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Visual flow comparison table">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" rx="16" fill="url(#bg)"/>
  <text x="500" y="36" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">At a glance: ordinary alarm vs Croc Sentinel</text>

  <!-- Header -->
  <rect x="40" y="58" width="420" height="40" rx="8" fill="#334155"/>
  <text x="250" y="84" text-anchor="middle" fill="#94a3b8" font-size="14" font-weight="700" font-family="Segoe UI">Ordinary alarm</text>
  <rect x="540" y="58" width="420" height="40" rx="8" fill="#1e3a8a"/>
  <text x="750" y="84" text-anchor="middle" fill="#bfdbfe" font-size="14" font-weight="700" font-family="Segoe UI">Croc Sentinel</text>

  <!-- Rows -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <rect x="40" y="106" width="920" height="48" fill="#1e293b"/>
    <text x="60" y="136" fill="#cbd5e1">Urgency</text>
    <text x="250" y="136" text-anchor="middle" fill="#f87171">Everything feels the same</text>
    <text x="750" y="136" text-anchor="middle" fill="#4ade80">Score 0-100 + plain reason</text>

    <rect x="40" y="154" width="920" height="48" fill="#0f172a"/>
    <text x="60" y="184" fill="#cbd5e1">Who to call</text>
    <text x="250" y="184" text-anchor="middle" fill="#f87171">You guess</text>
    <text x="750" y="184" text-anchor="middle" fill="#4ade80">Calls the right person</text>

    <rect x="40" y="202" width="920" height="48" fill="#1e293b"/>
    <text x="60" y="232" fill="#cbd5e1">No answer</text>
    <text x="250" y="232" text-anchor="middle" fill="#f87171">Chain breaks</text>
    <text x="750" y="232" text-anchor="middle" fill="#4ade80">Auto-escalates to next</text>

    <rect x="40" y="250" width="920" height="48" fill="#0f172a"/>
    <text x="60" y="280" fill="#cbd5e1">Big event</text>
    <text x="250" y="280" text-anchor="middle" fill="#f87171">Chaos</text>
    <text x="750" y="280" text-anchor="middle" fill="#4ade80">Team roles organised</text>

    <rect x="40" y="298" width="920" height="48" fill="#1e293b"/>
    <text x="60" y="328" fill="#cbd5e1">Afterwards</text>
    <text x="250" y="328" text-anchor="middle" fill="#f87171">Scattered logs</text>
    <text x="750" y="328" text-anchor="middle" fill="#4ade80">Full proof + review</text>

    <rect x="40" y="346" width="920" height="48" fill="#0f172a"/>
    <text x="60" y="376" fill="#cbd5e1">Before it happens</text>
    <text x="250" y="376" text-anchor="middle" fill="#f87171">Nothing</text>
    <text x="750" y="376" text-anchor="middle" fill="#4ade80">Plans + readiness + drills</text>
  </g>

  <text x="500" y="410" text-anchor="middle" fill="#64748b" font-size="10" font-family="Segoe UI">Same cameras. Same alarms. A completely different response.</text>
</svg>
