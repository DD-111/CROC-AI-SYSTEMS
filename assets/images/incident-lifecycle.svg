<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Before, During, After  the full response journey">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="320" rx="20" fill="url(#bg)"/>
  <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">The full response journey</text>
  <text x="450" y="68" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Not just "something happened"  ready, respond, prove</text>

  <!-- BEFORE -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="240" height="180" rx="16" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="160" y="135" text-anchor="middle" fill="#bbf7d0" font-size="16" font-weight="700">BEFORE</text>
    <text x="160" y="158" text-anchor="middle" fill="#86efac" font-size="12">Get ready</text>
    <text x="160" y="188" text-anchor="middle" fill="#dcfce7" font-size="11"> Response plans set</text>
    <text x="160" y="210" text-anchor="middle" fill="#dcfce7" font-size="11"> Readiness score</text>
    <text x="160" y="232" text-anchor="middle" fill="#dcfce7" font-size="11"> Practice drills</text>
    <text x="160" y="260" text-anchor="middle" fill="#86efac" font-size="10">"Are we prepared?"</text>
  </g>

  <!-- arrow 1 -->
  <path d="M 290 190 L 318 190" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>

  <!-- DURING -->
  <g filter="url(#shadow)">
    <rect x="330" y="100" width="240" height="180" rx="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="450" y="135" text-anchor="middle" fill="#bfdbfe" font-size="16" font-weight="700">DURING</text>
    <text x="450" y="158" text-anchor="middle" fill="#93c5fd" font-size="12">Respond together</text>
    <text x="450" y="188" text-anchor="middle" fill="#dbeafe" font-size="11"> Score + call + dispatch</text>
    <text x="450" y="210" text-anchor="middle" fill="#dbeafe" font-size="11"> Live map + timeline</text>
    <text x="450" y="232" text-anchor="middle" fill="#dbeafe" font-size="11"> Team roles on big events</text>
    <text x="450" y="260" text-anchor="middle" fill="#93c5fd" font-size="10">"Who goes, what happens?"</text>
  </g>

  <path d="M 580 190 L 608 190" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- AFTER -->
  <g filter="url(#shadow)">
    <rect x="620" y="100" width="240" height="180" rx="16" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <text x="740" y="135" text-anchor="middle" fill="#e9d5ff" font-size="16" font-weight="700">AFTER</text>
    <text x="740" y="158" text-anchor="middle" fill="#d8b4fe" font-size="12">Prove &amp; learn</text>
    <text x="740" y="188" text-anchor="middle" fill="#f3e8ff" font-size="11"> Full timeline saved</text>
    <text x="740" y="210" text-anchor="middle" fill="#f3e8ff" font-size="11"> Proof of what was done</text>
    <text x="740" y="232" text-anchor="middle" fill="#f3e8ff" font-size="11"> Post-incident review</text>
    <text x="740" y="260" text-anchor="middle" fill="#d8b4fe" font-size="10">"What really happened?"</text>
  </g>

  <text x="450" y="305" text-anchor="middle" fill="#64748b" font-size="11" font-family="Segoe UI, Arial, sans-serif">Ordinary alarms stop at the beep. Croc Sentinel runs the whole loop.</text>
</svg>
