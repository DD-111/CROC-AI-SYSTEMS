<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="Mobile app  alert, map, respond">
  <defs>
    <linearGradient id="phone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="280" rx="16" fill="#0f172a"/>

  <!-- Phone 1: Alert -->
  <rect x="40" y="30" width="140" height="220" rx="16" fill="#334155" stroke="#64748b"/>
  <rect x="48" y="50" width="124" height="190" rx="10" fill="url(#phone)"/>
  <text x="110" y="75" text-anchor="middle" fill="#f8fafc" font-size="10" font-weight="700" font-family="Segoe UI">=¨ Alert</text>
  <rect x="58" y="85" width="104" height="50" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="110" y="105" text-anchor="middle" fill="#fecaca" font-size="8" font-family="Segoe UI">North gate</text>
  <text x="110" y="120" text-anchor="middle" fill="#fca5a5" font-size="7" font-family="Segoe UI">89/100 HIGH</text>
  <rect x="58" y="145" width="104" height="28" rx="6" fill="#1d4ed8"/>
  <text x="110" y="163" text-anchor="middle" fill="#fff" font-size="8" font-family="Segoe UI">Open map</text>
  <text x="110" y="200" text-anchor="middle" fill="#64748b" font-size="7" font-family="Segoe UI">Push + phone call</text>
  <text x="110" y="265" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Segoe UI">Get the alert</text>

  <!-- Phone 2: Map -->
  <rect x="200" y="30" width="140" height="220" rx="16" fill="#334155" stroke="#64748b"/>
  <rect x="208" y="50" width="124" height="190" rx="10" fill="url(#phone)"/>
  <rect x="218" y="70" width="104" height="120" rx="6" fill="#0c4a6e"/>
  <circle cx="270" cy="130" r="6" fill="#ef4444" stroke="#fff"/>
  <circle cx="250" cy="150" r="4" fill="#3b82f6"/>
  <text x="270" y="210" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Segoe UI">See where</text>

  <!-- Phone 3: Respond -->
  <rect x="360" y="30" width="140" height="220" rx="16" fill="#334155" stroke="#64748b"/>
  <rect x="368" y="50" width="124" height="190" rx="10" fill="url(#phone)"/>
  <text x="430" y="80" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="Segoe UI">Your job</text>
  <rect x="378" y="90" width="104" height="36" rx="6" fill="#14532d" stroke="#22c55e"/>
  <text x="430" y="108" text-anchor="middle" fill="#bbf7d0" font-size="8" font-family="Segoe UI">Accept ’ Go ’ Arrive</text>
  <rect x="378" y="135" width="104" height="28" rx="6" fill="#1d4ed8"/>
  <text x="430" y="153" text-anchor="middle" fill="#fff" font-size="8" font-family="Segoe UI">Mark resolved</text>
  <text x="430" y="210" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Segoe UI">Do your part</text>

  <!-- Phone 4: History -->
  <rect x="520" y="30" width="140" height="220" rx="16" fill="#334155" stroke="#64748b"/>
  <rect x="528" y="50" width="124" height="190" rx="10" fill="url(#phone)"/>
  <text x="590" y="75" text-anchor="middle" fill="#f8fafc" font-size="9" font-family="Segoe UI">Timeline</text>
  <line x1="548" y1="95" x2="632" y2="95" stroke="#475569"/>
  <line x1="548" y1="115" x2="632" y2="115" stroke="#334155"/>
  <line x1="548" y1="135" x2="632" y2="135" stroke="#334155"/>
  <line x1="548" y1="155" x2="632" y2="155" stroke="#334155"/>
  <text x="590" y="210" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="Segoe UI">Full record</text>

  <text x="360" y="18" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600" font-family="Segoe UI, Arial, sans-serif">On your phone  iPhone &amp; Android</text>
</svg>
